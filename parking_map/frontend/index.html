<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="map.css">
<script src="vendor/leaflet.js"></script>
<script src="vendor/turf.min.js"></script>
</head>
<body>
<div class="toolbar" role="group" aria-label="Map mode">
  <button data-mode="move" aria-pressed="true">Move map</button>
  <button data-mode="spot" aria-pressed="false">Mark a spot</button>
  <button data-mode="highlight" aria-pressed="false">Highlight area</button>
  <label id="brush-label" hidden>Stroke width <select id="brush-width" aria-label="Highlighter width"><option value="4">4 m</option><option value="8" selected>8 m</option><option value="12">12 m</option><option value="20">20 m</option></select></label>
</div>
<p id="instruction">Drag to explore. Choose Mark a spot or Highlight area to start a report.</p>
<div id="map" aria-label="Parking map"></div>
<div class="actions">
  <button id="undo" disabled>Undo stroke</button>
  <button id="clear" disabled>Clear selection</button>
  <button id="use" class="primary" disabled>Use selected location</button>
</div>
<p id="status" role="status" aria-live="polite">Include only spaces covered by the same parking conditions.</p>
<script src="map.js"></script>
</body>
</html>
